name: run

# 定时说明
# ---------------------------------------------------------------------------
# 本 workflow 只做「检查当天是否已签到」，不执行签到（不 POST /api/user/checkin）。
# 判断依据：积分流水（/api/user/points 的 history）是否含今天的记录。
#
# 【关于 cron 时间与实际执行时间的偏差】
# GitHub 对低活跃仓库的 scheduled workflow 有 4~8 小时的调度延迟（不可控，
# 本仓库实测近期稳定在 ~8h：cron 02:07 实际 10:10 执行、cron 13:07 实际 21:16 执行）。
# 因此 cron 刻意提前 8 小时补偿，让实际执行落回目标时间：
#   - cron '7 18 * * *' = UTC 18:07（计划北京 02:07）→ 实际约北京 10:07 早检查
#   - cron '7 5 * * *'  = UTC 05:07（计划北京 13:07）→ 实际约北京 21:07 晚检查
#
# 通知策略（时段由「触发本次运行的 cron 表达式」决定，见 Determine check slot 步骤，
# 不受调度延迟影响；补偿失准导致实际执行落在北京 00:00-05:59 时 main.js 会静默普通通知）：
#   - 早检查：无论结果都推送通知
#   - 晚检查：仅有账号未签到 / 异常时推送通知
#
# 【重要】不要保留 push 触发器：任何一次 commit/push 都会立刻跑一次检查。
# 改由 schedule + 手动 dispatch 触发。
# ---------------------------------------------------------------------------
on:
  workflow_dispatch:
    inputs:
      slot:
        description: '检查时段（决定通知策略）'
        type: choice
        default: morning
        options:
          - morning
          - evening
  schedule:
    - cron: '7 18 * * *'
    - cron: '7 5 * * *'

# 同一时间只允许一个检查实例，避免并发冲突
concurrency:
  group: glados-checkin
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install
        run: npm ci || npm install

      # 时段归属：由触发的 cron 表达式决定（早=18:07 UTC 那条，晚=05:07 UTC 那条），
      # 与实际执行时刻无关——GitHub 调度延迟不会改变早晚语义。
      - name: Determine check slot
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_SCHEDULE: ${{ github.event.schedule }}
          INPUT_SLOT: ${{ inputs.slot }}
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            slot="${INPUT_SLOT:-morning}"
          elif [ "$EVENT_SCHEDULE" = "7 18 * * *" ]; then
            slot=morning
          else
            slot=evening
          fi
          echo "CHECK_SLOT=$slot" >> "$GITHUB_ENV"
          echo "检查时段: $slot (event=$EVENT_NAME schedule='$EVENT_SCHEDULE')"

      # 检查前先确认协议没变。宽松模式：只打印告警，不阻断检查，
      # 避免误报；严重变化由独立的 guard.yml 严格告警。
      - name: Protocol Guard
        run: node guard.js --soft
        continue-on-error: true
        env:
          DOMAIN: ${{ secrets.DOMAIN }}

      - name: Check (只检查当天是否已签到，不执行签到)
        run: npm run main
        env:
          GLADOS: ${{ secrets.GLADOS }}
          GLADOS_UA: ${{ secrets.GLADOS_UA }}
          # 多账号：在仓库 Secrets 里按需新增 GLADOS2 / GLADOS3 / …… 即可，
          # 未配置时值为空字符串，脚本会自动跳过，不影响原有账号。
          GLADOS2: ${{ secrets.GLADOS2 }}
          GLADOS_UA2: ${{ secrets.GLADOS_UA2 }}
          GLADOS2_UA: ${{ secrets.GLADOS2_UA }}
          GLADOS3: ${{ secrets.GLADOS3 }}
          GLADOS_UA3: ${{ secrets.GLADOS_UA3 }}
          GLADOS3_UA: ${{ secrets.GLADOS3_UA }}
          DOMAIN: ${{ secrets.DOMAIN }}
          NOTIFY: ${{ secrets.NOTIFY }}
          AUTO_EXCHANGE: ${{ secrets.AUTO_EXCHANGE }}
          EXCHANGE_THRESHOLD: ${{ secrets.EXCHANGE_THRESHOLD }}
